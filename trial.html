<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- responsive to mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shaimaa Hassan's Photo Editing Studio</title>
    <!-- icon style sheets -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/all.min.css">
    <!-- main style_t css file -->
    <link rel="stylesheet" href="css/style_t.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100;300;400;600&display=swap" rel="stylesheet">
<!-- Bootstrap5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- render all elements normally -->
<link rel="stylesheet" href="css/normalize.css">
</head>
<body>
    <div class="container m-auto row rounded p-4 bg-dark" style="width:80%;height:80%;background-color: #333;">
        <div class="img d-flex flex-column gap-3 justify-content-center align-items-center col-lg-7 col-sm-12">
            <div class="img-box">
                <img style="max-width: 45vw; max-height: 60vh;" src="" alt="img1" id="img">
                <canvas style="max-width: 45vw; max-height: 60vh;" id="canvas"></canvas>
            </div>
            <div class="upload">
                <label class="text-white px-3 py-2 rounded btn-outline-primary text-capitalize " style="cursor: pointer; border: 1px dashed white" for="upload">upload</label>
                <input style="display: none;" type="file" id="upload">
            </div>
        </div>
        <div class="filters col-lg-5 col-sm-12 text-capitalize">
            <ul class="d-flex flex-column gap-3">
                <li class="d-flex flex-column gap-1 text-end">
                    <label class=" text-white" dir="rtl" for="saturate">saturate</label>
                    <input type="range" name="" id="saturate" min="0" value="100" max="200">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="contrast">contrast</label>
                    <input type="range" name="" id="contrast" min="0" value="100" max="200">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="brightness">brightness</label>
                    <input type="range" name="" id="brightness" min="0" value="100" max="200">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="sepia">sepia</label>
                    <input type="range" name="" id="sepia" min="0" value="0" max="200">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="grayscale">grayscale</label>
                    <input type="range" name="" id="grayscale" step="0.1" min="0" value="0" max="1">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="blur">blur</label>
                    <input type="range" name="" id="blur" step="0.1" min="0" value="0" max="10">
                </li>
                <li class="d-flex flex-column gap-1 text-end">
                    <label class="text-white" dir="rtl" for="hue-rotate">hue-rotate</label>
                    <input type="range" name="" id="hue-rotate" min="0" value="0" max="350">
                </li>
                <li class="d-flex justify-content-around gap-1">
                    <a class="text-white btn-outline-primary btn-danger rounded px-4 py-2 text-decoration-none" style="cursor: pointer; transition: 0.3s;" download="photo" id="download">download</a>
                    <span class="text-white btn-outline-primary rounded btn-danger px-4 py-2" onclick="resetValue();" style="cursor: pointer; transition: 0.3s;">reset</span>
                </li>
            </ul>
        </div>
    </div>
    <!-- js-Bootstrap5 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- js -->
    <script src="javascript/imgediting.js"></script>
</body>
</html>
